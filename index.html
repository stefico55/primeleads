<style>
/* VOICE: outil de phoning B2B, calme et dense, zéro décoration
   IDEA: le registre de prospection d'un bureau d'études : un tableau, une fiche qui glisse de côté
   PICTURE: le tableau des prospects plein écran ; la carte aérienne IGN en vue dédiée
   COLOUR and TYPE: marine PACLIM, vert d'accent mesuré, lignes bleu ciel une sur deux ; Barlow
   LAYOUT: barre haute + vues (Prospection, Pipeline, Carte, Réglages) ; fiche latérale 4 onglets */
:root{color-scheme:light;--bg:#f5f7fa;--card:#fff;--ink:#0b192c;--mut:#4d5d70;--line:#dbe3ec;--soft:#eef5fb;--navy:#0b192c;--navy2:#0f2942;--green:#4f9a24;--greenbg:#e7f3dd;--amber:#a86f0e;--amberbg:#fbf0dc;--blue:#24578f;--bluebg:#e4eef9;--red:#a8442f;--redbg:#f8e6e1;--r:6px}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 max(2vw,14px);min-height:58px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}.logo .lg{height:26px;width:auto;display:block}.logo small{border-left:1px solid #2b4566;padding-left:10px;color:#9fb3c8;font-size:14px}
.nav{display:flex;gap:2px;overflow-x:auto}.nav button{background:none;border:0;color:#c3d1df;padding:18px 10px 16px;border-bottom:2px solid transparent;font-weight:600;white-space:nowrap}
.nav button[aria-current=page]{color:#fff;border-bottom-color:#7cc444}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;color:#c3d1df;font-size:14px}
.who select{background:var(--navy2);border:1px solid #2b4566;color:#fff;border-radius:var(--r);min-height:36px;padding:0 8px}
main{max-width:1600px;margin:0 auto;padding:16px max(2vw,14px) 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}.pad{padding:16px}
h1{font-size:24px;line-height:1.15;margin:0}h2{font-size:19px;margin:0 0 6px}h3{font-size:15px;margin:0 0 8px}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:26px;line-height:1.1}.kpi span{font-size:13px;color:var(--mut)}
.kpi.d{background:var(--navy);border-color:var(--navy);color:#fff}.kpi.d span{color:#b7c6d6}.kpi.d em{font-style:normal;color:#9be064;font-weight:700;font-size:15px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:12px;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:var(--r);min-height:36px;padding:0 10px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}.chip .n{color:var(--mut);font-weight:500;margin-left:4px}.chip[aria-pressed=true] .n{color:#c3d1df}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.search{flex:1 1 240px;min-height:38px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px;font-size:16px}
.scroll{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:15px}
.tb th{text-align:left;font-size:13px;font-weight:600;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfd}
.tb td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.tb tbody tr:nth-child(even) td{background:var(--soft)}
.tb tbody tr:hover td{background:#f1f7ec}
.tb tr.on td{background:#eaf4e2}

/* ===== MATERIAL 3 / look Google =====
   Tokens : primaire #0b57d0 (bleu Google), surfaces teintées, capsules, coins 16px.
   Les couleurs de sens (DPE, fossile, électrique, prime verte) restent inchangées. */
:root{--m-pri:#0b57d0;--m-pri-h:#0842a0;--m-on-pri:#fff;--m-pc:#d3e3fd;--m-onpc:#041e49;--m-sc:#c2e7ff;
--m-bg:#f6f8fc;--m-s1:#eaf1fb;--m-s2:#dde3ea;--m-out:#dadce0;--m-out2:#c4c7c5;--m-txt:#1f1f1f;--m-mut:#5f6368;
--bg:var(--m-bg);--ink:var(--m-txt);--mut:var(--m-mut);--line:var(--m-out);--soft:#f8fafd;--navy:#041e49;--navy2:#0b2a5e;
--r:12px;--sans:"Google Sans","Google Sans Text",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Roboto Mono",ui-monospace,Menlo,monospace}
body{background:var(--m-bg);color:var(--m-txt);font-family:var(--sans);letter-spacing:0}
button,input,select,textarea{font-family:var(--sans)}
:focus-visible{outline:2px solid var(--m-pri);outline-offset:2px;border-radius:8px}
/* boutons : capsule, état plein / tonal / contour */
.btn{border-radius:999px;border:1px solid var(--m-out2);background:var(--card);color:var(--m-pri);font-weight:500;min-height:36px;padding:0 18px;transition:background .15s,box-shadow .15s}
.btn:hover{background:#f0f4fc;border-color:var(--m-out2);box-shadow:none}
.btn.p,.tb tbody tr:first-child .btn{background:var(--m-pri);border-color:var(--m-pri);color:#fff}
.btn.p:hover,.tb tbody tr:first-child .btn:hover{background:var(--m-pri-h);border-color:var(--m-pri-h);box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15)}
.btn.g{background:var(--m-pc);border-color:var(--m-pc);color:var(--m-onpc)}
.btn.s{min-height:30px;padding:0 14px}
/* champs : contour M3 */
input[type=text],input[type=search],input[type=email],input[type=tel],input[type=number],input[type=url],input:not([type]),select,textarea{border-radius:8px;border:1px solid var(--m-out2);background:var(--card)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--m-pri);box-shadow:inset 0 0 0 1px var(--m-pri)}
/* cartes : surface blanche, coins 16, ombre M3 niveau 1 */
.card{border-radius:16px;border:0;background:var(--card);box-shadow:0 1px 2px rgba(60,64,67,.15),0 1px 3px 1px rgba(60,64,67,.08)}
.card>.lh,.card>.bar{background:var(--m-s1)}
.card>.lh{border-radius:16px 16px 0 0}
.tb th{background:#f8fafd;color:var(--m-mut);font-weight:500;letter-spacing:0;text-transform:none;font-size:12.5px}
.tb td{border-color:#eceff1}
.tb tbody tr:hover td{background:#f1f5fc}
/* barre latérale : navigation capsule bleu pâle (Gmail / Drive) */
@media(min-width:901px){
 .nav button{border-radius:999px;color:var(--m-txt);font-weight:500}
 .nav button:hover{background:#e9eef6;color:var(--m-txt)}
 .nav button[aria-current=page]{background:var(--m-pc);color:var(--m-onpc);box-shadow:none}.nav button[aria-current=page] .ic{color:var(--m-pri)}
}
/* onglets : indicateur primaire */
.dnav button{color:var(--m-mut);font-weight:500}
.dnav button[aria-selected=true]{color:var(--m-pri);border-bottom:3px solid var(--m-pri);border-radius:3px 3px 0 0}
/* fiche */
.dh{background:var(--card);border-bottom:1px solid var(--m-out)}
.dh h2{font-weight:400;font-size:28px;letter-spacing:0}
.dh .pnb,.dh .qa .btn{border-radius:999px}
.dh .qa .btn{color:var(--m-pri);border-color:var(--m-out2)}
.dh .qa .btn:first-child{background:var(--m-pri);color:#fff;border-color:var(--m-pri)}
.dh .mt{border-radius:8px}
/* barre d'actions groupées : surface foncée M3 (snackbar) */
.bk{background:#303030;color:#fff;border-radius:16px;box-shadow:0 4px 8px 3px rgba(60,64,67,.15),0 1px 3px rgba(60,64,67,.3)}
.bk .btn{background:transparent;border-color:#5f6368;color:#a8c7fa}.bk .btn.p{background:#a8c7fa;border-color:#a8c7fa;color:#062e6f}
/* pipeline */
.kc{border-radius:12px;border:1px solid var(--m-out);box-shadow:none;background:var(--card)}
.kc:hover{border-color:var(--m-out);box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15)}
.kan .col{background:var(--m-s1);border-radius:16px;padding:10px}
.kan .col h3{font-weight:500}
/* toasts : snackbar */
.toast,#toast{background:#303030;color:#fff;border-radius:8px;box-shadow:0 2px 6px 2px rgba(60,64,67,.15),0 1px 2px rgba(60,64,67,.3)}
/* pastilles et étiquettes : 8px (M3 assist chip) */
.tag,.pill,.chip{border-radius:8px}

.fb{border-radius:8px;border-color:var(--m-out2);background:var(--card);color:var(--m-txt);font-weight:500}
.fb:hover{background:#f0f4fc}
.fb.on,.fb[data-on="1"],.fb.act{background:var(--m-pc);border-color:var(--m-pc);color:var(--m-onpc)}
.fbtn.btn.p{border-radius:8px;background:var(--m-pri);border-color:var(--m-pri)}
.srch input{border-radius:999px;background:var(--m-s1);border-color:transparent}
.srch input:focus{background:var(--card)}

.tpt b{color:var(--m-pri);font-weight:400}
.tph{background:var(--card)}
.tr{border-radius:999px}
.tr.on{background:var(--m-pc);color:var(--m-onpc);box-shadow:none}.tr.on .ic{color:var(--m-pri)}
.sl input[type=range]{accent-color:var(--m-pri)}
.hs i{background:#8ab4f8;opacity:1}.hs i.off{background:#e8eaed}
.cd{border-radius:12px}
.cd.on,.cd[aria-pressed=true]{background:var(--m-pc);border-color:var(--m-pri)}
.sgb[aria-pressed=true],.sgb.on{background:var(--m-pc);color:var(--m-onpc)}
.sg{border-radius:999px}.sgb{border-radius:999px}
.fn,.fbtn .fn{background:#fff;color:var(--m-pri)}

/* ===== COUCHE APPLE (HIG / Liquid Glass) par-dessus Material =====
   SF Pro (système Apple, Inter ailleurs), verre dépoli, coins continus, segmented controls,
   remplissages gris translucides, halos de focus, ressort doux. */
:root{--m-pri:#0071e3;--m-pri-h:#0062c4;--m-pc:rgba(0,113,227,.12);--m-onpc:#0058b0;
--m-bg:#f5f5f7;--m-s1:rgba(255,255,255,.62);--m-out:rgba(60,60,67,.14);--m-out2:rgba(60,60,67,.24);--m-txt:#1d1d1f;--m-mut:#6e6e73;
--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.18);--glass:rgba(255,255,255,.72);--ease:cubic-bezier(.2,.8,.2,1);
--navy:#0a2a52;--navy2:#103a6e;--r:12px;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Helvetica Neue",Roboto,system-ui,sans-serif}
body{background:var(--m-bg);-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
:focus-visible{outline:0;box-shadow:0 0 0 4px rgba(0,113,227,.35)}
input:focus,select:focus,textarea:focus{border-color:var(--m-pri);box-shadow:0 0 0 4px rgba(0,113,227,.25)}
/* titres : grands, serrés, 600 */
.dh h2,.card>.lh h2,.ph h2,.pl h2{font-weight:600;letter-spacing:-.022em}
.dh h2{font-size:30px;line-height:1.1}
/* verre : barre latérale, tiroir, panneau, barre d'outils */
@media(min-width:901px){
 .top{background:rgba(246,246,248,.72);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);border-right:.5px solid var(--m-out)}
 .nav button{border-radius:10px}
 .nav button[aria-current=page]{background:rgba(0,113,227,.12);color:var(--m-onpc)}
 .nav button:hover{background:rgba(60,60,67,.08)}
}
.drawer{background:rgba(245,245,247,.86);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);box-shadow:-.5px 0 0 var(--m-out),-24px 0 60px rgba(0,0,0,.14);transition:transform .38s var(--ease)}
.dh{background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--m-out)}
.scrim{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#tp,.tp{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.card>.lh,.card>.bar{background:rgba(255,255,255,.55);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.card>.bar{border-bottom:.5px solid var(--m-out)}
/* cartes : coins continus 18, relief multi-couches très doux */
.card{border-radius:18px;box-shadow:0 0 0 .5px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}
.card>.lh{border-radius:18px 18px 0 0}
.kc{border-radius:14px;border:0;box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.06);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.kc:hover{transform:translateY(-2px);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 8px 22px rgba(0,0,0,.12)}
.kan .col{background:rgba(60,60,67,.06);border-radius:18px}
/* boutons : rectangle arrondi, plein bleu / gris tonal, pas de contour */
.btn{border-radius:10px;border:0;background:var(--fill);color:var(--m-pri);font-weight:500;transition:background .2s var(--ease),transform .15s var(--ease)}
.btn:hover{background:var(--fill2);box-shadow:none}
.btn:active{transform:scale(.97)}
.btn.p,.tb tbody tr:first-child .btn{background:var(--m-pri);color:#fff}
.btn.p:hover,.tb tbody tr:first-child .btn:hover{background:var(--m-pri-h);box-shadow:none}
.btn.g{background:var(--m-pc);color:var(--m-onpc)}
.dh .qa .btn{background:var(--fill);color:var(--m-pri);border:0;border-radius:10px}
.dh .qa .btn:first-child{background:var(--m-pri);color:#fff}
.dh .pnb{border:0;background:var(--fill);border-radius:50%}
.fbtn.btn.p{border-radius:10px}
/* filtres, recherche : remplissage gris translucide (iOS) */
.fb{border:0;background:var(--fill);border-radius:10px;color:var(--m-txt)}
.fb:hover{background:var(--fill2)}
.srch input{border:0;background:var(--fill);border-radius:10px}
.srch input:focus{background:#fff;box-shadow:0 0 0 4px rgba(0,113,227,.25)}
/* segmented control : piste grise, pastille blanche surélevée */
.sg{background:var(--fill);border-radius:9px;padding:2px;border:0;gap:0}
.sgb{border-radius:7px;border:0;background:none;color:var(--m-txt);transition:background .2s var(--ease),box-shadow .2s var(--ease)}
.sgb[aria-pressed=true],.sgb.on{background:#fff;color:var(--m-txt);box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.tr{border-radius:10px}.tr.on{background:rgba(0,113,227,.12);color:var(--m-onpc)}
.cd{border-radius:14px;border:0;background:var(--fill)}
.cd.on,.cd[aria-pressed=true]{background:rgba(0,113,227,.12);box-shadow:inset 0 0 0 1.5px var(--m-pri)}
.hs i{background:#7ab8f5}
/* tableau : filets .5px, survol discret */
.tb th{background:rgba(255,255,255,.6);color:var(--m-mut);font-weight:500;border-bottom:.5px solid var(--m-out)}
.tb td{border-color:rgba(60,60,67,.1)}
.tb tbody tr{transition:background .2s var(--ease)}
.tb tbody tr:hover td{background:rgba(0,113,227,.04)}
.dnav button[aria-selected=true]{border-bottom:2px solid var(--m-pri)}
/* barre groupée et message : verre sombre */
.bk,.toast,#toast{background:rgba(30,30,32,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:#fff;border:0;box-shadow:0 8px 30px rgba(0,0,0,.28)}
.bk{border-radius:18px}.toast,#toast{border-radius:14px}
.bk .btn{background:rgba(255,255,255,.14);color:#fff}.bk .btn.p{background:var(--m-pri);color:#fff}
/* cases à cocher : coins arrondis, bleu Apple */
input[type=checkbox]{accent-color:var(--m-pri);border-radius:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== aplats : ni dégradés, ni halos ===== */
:focus-visible{outline:2px solid var(--m-pri);outline-offset:2px;box-shadow:none}
input:focus,select:focus,textarea:focus,.srch input:focus,.srch input:focus-visible{box-shadow:none;outline:2px solid var(--m-pri);outline-offset:0;border-color:var(--m-pri)}
.scrim{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(0,0,0,.3)}
.drawer,.dh,#tp,.tp,.card>.lh,.card>.bar,.top{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.drawer{background:#f5f5f7;box-shadow:-1px 0 0 var(--m-out2)}
.dh{background:#fff}
#tp,.tp{background:#fff}

@keyframes agp{0%{box-shadow:0 0 0 0 rgba(217,48,37,.45)}100%{box-shadow:0 0 0 12px rgba(217,48,37,0)}}
@media(prefers-reduced-motion:reduce){.agmic.on{animation:none}}
.logo{cursor:pointer}.logo:focus-visible{outline:2px solid #1a39d3;outline-offset:-3px}
#auth{position:fixed;inset:0;z-index:300;background:#eef5fd;display:grid;place-items:center;padding:20px;overflow:auto}#auth[hidden]{display:none}
#authF{width:min(400px,100%);background:#fff;border-radius:16px;padding:32px 30px 26px;box-shadow:0 10px 40px rgba(15,42,84,.12);display:flex;flex-direction:column}
#authF .aulg img{height:50px;display:block;margin:-4px 0 14px -26px}#authF h1{font-size:22px;color:#0f2a54;margin:0 0 4px}.aus{margin:0 0 18px;color:#5b6b7d;font-size:14px}
#authF label{font-size:13px;font-weight:600;color:#0f2a54;margin:10px 0 5px}#authF input{height:44px;border:1px solid #cfd8e3;border-radius:10px;padding:0 12px;font-size:16px}#authF input:focus-visible{outline:2px solid #1a39d3;outline-offset:1px}
#auErr{min-height:20px;margin:10px 0 0;color:#b3261e;font-size:14px}.aub{height:46px;border:0;border-radius:10px;background:#1a39d3;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px}.aub:disabled{opacity:.6;cursor:default}.aub:hover:not(:disabled){background:#1530b0}
#authF .lnk{margin-top:14px;text-align:center}
#clb{margin-top:8px;font-size:12px;color:var(--mut);line-height:1.5}#clb .lnk{font-size:12px;padding:0}.cld{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#2e9e4f}.cld.sync{background:#d99a00}.cld.err{background:#d93025}
.aub2{height:44px;border:1px solid #1a39d3;background:#fff;color:#1a39d3;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}.aub2:hover:not(:disabled){background:#eef5fd}.aub2:disabled{opacity:.6}
</style>

function agFiche(c){const b=BAREMES[c];if(!b)return"";return `<b>${c}</b> · ${b.nom} · version ${b.version}.<br>Conditions : ${(b.cond||[]).join(" ; ")}.`}
function agKnow(t){const n=agNorm(t);for(const e of AG_KNOW)if(e.k.test(n))return e;return null}

function agParse(t,b){const n=agNorm(t);
 if(/industr/.test(n))b.sect="Industrie";else if(/tertiaire|bureau|commerce/.test(n))b.sect="Tertiaire";else if(/peu importe|tous|aucun|indiff/.test(n)&&!b.sect)b.sect="*";
 const m=n.match(/(\d[\d\s.]*)\s*(m2|m²|m )/);if(m)b.surf=+m[1].replace(/[\s.]/g,"");else if(/peu importe/.test(n)&&b.surf==null)b.surf=0;
 if(/froid|frigo/.test(n))(b.crit=b.crit||[]).includes("froid")||b.crit.push("froid");
 if(/gaz/.test(n))(b.crit=b.crit||[]).includes("gaz")||b.crit.push("gaz");
 if(/dpe/.test(n))(b.crit=b.crit||[]).includes("dpe")||b.crit.push("dpe");
 if(/aucun critere|sans critere/.test(n))b.crit=b.crit||[];
 return b}
function agSelect(b){let L=S.leads.filter(l=>(b.sect&&b.sect!=="*"?secteur(l)===b.sect:true)&&(+l.surface||0)>=(b.surf||0));
 (b.crit||[]).forEach(c=>{if(c==="froid")L=L.filter(froidP);if(c==="gaz")L=L.filter(l=>nrjOf(l)==="gaz");if(c==="dpe")L=L.filter(l=>["E","F","G"].includes(l.dpe))});
 return L.sort((a,b)=>score(b)-score(a)).slice(0,8)}
function agWhy(l){const r=calc(l),d=dim(l),w=[];const h=Number(l.q.hsp||l.hauteur||0);
 if(h>=10)w.push(`hauteur d'environ ${h} m : déstratification très pertinente`);else if(h>=5)w.push(`hauteur ${h} m : déstratification possible`);
 if(froidP(l))w.push("groupe froid : régulation HP flottante possible");
 if(["F","G"].includes(l.dpe))w.push(`DPE ${l.dpe} : bâtiment énergivore`);
 if(d)w.push(`${d.n} appareils ${d.modele} estimés`);
 if(l.q.statutOcc==="proprio")w.push("propriétaire : décision plus simple");
 return w.slice(0,3)}
function agPrime(l){const r=calc(l);if(r.hi)return agEur(r);const e=estim(l);return e?eur(e.lo)+" à "+eur(e.hi)+" (hypothèse)":"à chiffrer"}
/* ---- fiche à confirmer ---- */
function agConfirm(l){const r=calc(l),q=l.q,todo=[...new Set(r.fiches.filter(f=>f.etat!=="ko").flatMap(f=>f.msgs))],ko=r.fiches.filter(f=>f.etat==="ko");
 let h=`<b>${esc(l.entreprise)}</b> : ${r.hi?`prime chiffrée <b>${agEur(r)}</b>.`:`prime estimée sur hypothèse : <b>${agPrime(l).replace(" (hypothèse)","")}</b>.`}<br>`;
 if(ko.length)h+=`Point bloquant : ${ko.map(f=>esc(f.msgs[0])).join(" ; ")}.<br>`;

 else h+=`<br>Les données sont complètes : tu peux envoyer la note chiffrée.`;

 h+=`<span class="agn">${q.contact||per?`Interlocuteur : ${esc(q.contact||per.n)}${per&&per.f?" ("+esc(per.f)+")":""}.`:"Aucun interlocuteur renseigné : commence par identifier le décideur."} Rappelle-lui que la demande de prime précède la signature du devis.</span>`;
 return h}

const AG_Q={sect:["Quel type de bâtiment ou de secteur recherches-tu ?",[["Industrie","Industrie"],["Tertiaire","Tertiaire"],["Peu importe","peu importe"]],"sect"],

async function clStart(session){const uid=session.user.id;
 const m=await CL.sb.from("membres").select("org_id,nom,role").eq("user_id",uid).limit(1);
 if(m.error)throw m.error;
 if(!m.data.length){await CL.sb.auth.signOut();throw new Error("Ton compte n'est rattaché à aucune organisation. Demande à ton administrateur de t'ajouter.")}
 Object.assign(CL,{uid,email:session.user.email,org:m.data[0].org_id,role:m.data[0].role,nom:m.data[0].nom});
 await clLoad();CL.on=true;hideAuth();
 if(!S.leads.length&&CL.role==="admin"){ask("Organisation vide","<p>Aucun bâtiment en ligne pour le moment. Importer les 30 bâtiments de Corbas pour démarrer ?</p>",()=>{S.leads=SEED.map(b=>({...b,statut:"new",q:{},journal:[]}));migr();save();render();toast("30 bâtiments importés");return true})}
 clBadge("ok");render()}
async function clOut(){try{await CL.sb.auth.signOut()}catch(e){}CL.on=false;sessionStorage.removeItem("pl_demo");location.reload()}
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState!=="visible"||!CL.on||CL.busy||CL.t||sel)return;try{const k=JSON.stringify(S.leads.map(l=>l.id+JSON.stringify(l)));await clLoad();if(k!==JSON.stringify(S.leads.map(l=>l.id+JSON.stringify(l))))render()}catch(e){}});
$("#authF").onsubmit=async e=>{e.preventDefault();const em=$("#auE").value.trim(),pw=$("#auP").value;if(!em||!pw){$("#auErr").textContent="Renseigne ton e-mail et ton mot de passe.";return}
 const go=$("#auGo");go.disabled=true;go.textContent="Connexion…";$("#auErr").textContent="";$("#auErr").style.color="";
 try{const {data,error}=await CL.sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error;$("#auP").value="";await clStart(data.session)}
 catch(err){$("#auErr").textContent=clMsg(err)}finally{go.disabled=false;go.textContent="Se connecter"}};
$("#auMagic").onclick=async()=>{const em=$("#auE").value.trim();if(!em){$("#auErr").textContent="Saisis d'abord ton e-mail.";$("#auE").focus();return}
 const b=$("#auMagic");b.disabled=true;$("#auErr").textContent="";
 try{const {error}=await CL.sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
  $("#auErr").style.color="#1d6b34";$("#auErr").textContent="Lien envoyé à "+em+". Ouvre l'e-mail et clique sur le lien (pense aux courriers indésirables)."}
 catch(err){$("#auErr").style.color="";$("#auErr").textContent=/rate|seconds|limit/i.test(err.message||"")?"Trop de demandes : patiente une minute avant de réessayer.":/signups? not allowed|not found/i.test(err.message||"")?"Aucun compte pour cet e-mail. Demande à ton administrateur de t'ajouter.":clMsg(err)}
 finally{b.disabled=false}};
$("#auDemo").onclick=()=>{sessionStorage.setItem("pl_demo","1");hideAuth();render()};
async function boot(){
 if(!window.supabase||sessionStorage.getItem("pl_demo")){render();return}
 try{CL.sb=supabase.createClient(CL.url,CL.key,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await CL.sb.auth.getSession();
  if(data.session){try{await clStart(data.session)}catch(e){showAuth(clMsg(e))}}else showAuth()}
 catch(e){render()}}
setTimeout(()=>ENR.auto(),6000);setTimeout(()=>ENR.auto(),25000);
if(window.supabase)boot();else{window.__sbFail=()=>{if(window.__sbReady){window.__sbReady=null;render()}};window.__sbReady=()=>{window.__sbReady=null;boot()};setTimeout(()=>{if(window.__sbReady){window.__sbReady=null;render()}},4000)}
}
</script>
</body>
</html>
